<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- 1. TOP BAR: Single Breath Input (#189ad3 Sky Blue) -->
  <rect x="80" y="48" width="840" height="72" fill="#189ad3" />
  <text x="500" y="93" fill="#ffffff" font-size="26" font-weight="bold" text-anchor="middle">
    Single Exhaled Breath Input
  </text>

  <!-- Split line from Top Bar -->
  <line x1="500" y1="120" x2="500" y2="175" stroke="#000000" stroke-width="2" />
  <line x1="170" y1="175" x2="830" y2="175" stroke="#000000" stroke-width="2" />
  <line x1="170" y1="175" x2="170" y2="265" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="830" y1="175" x2="830" y2="265" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. LEFT BLUE BOX: 50ms Circular Buffer equivalent (#0052cc / #0066ff) -->
  <rect x="35" y="267" width="270" height="68" fill="#0066ff" />
  <text x="170" y="295" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
    AEROSOL SAMPLING TRAP
  </text>
  <text x="170" y="318" fill="#ffffff" font-size="14" text-anchor="middle">
    (Captures non-volatile droplets)
  </text>

  <!-- 3. RIGHT GREEN BOX: Speech-Only VAD Trigger equivalent (#008a00) -->
  <rect x="695" y="267" width="270" height="68" fill="#008a00" />
  <text x="830" y="295" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
    FLOW GATING TRIGGER
  </text>
  <text x="830" y="318" fill="#ffffff" font-size="14" text-anchor="middle">
    (Deep-alveolar breath wakeup)
  </text>

  <!-- Lines from Left & Right down to Crimson Bar -->
  <line x1="170" y1="335" x2="170" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="175" y="375" fill="#000000" font-size="15">
    <tspan x="175" dy="0">(Impaction onto</tspan>
    <tspan x="175" dy="22">SPCE strip)</tspan>
  </text>

  <line x1="830" y1="335" x2="830" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="835" y="375" fill="#000000" font-size="15">
    <tspan x="835" dy="0">(Wakes up only</tspan>
    <tspan x="835" dy="22">on valid flow)</tspan>
  </text>

  <!-- 4. WIDE CRIMSON BANNER: Dual Output DCCRN equivalent (#990024) -->
  <rect x="35" y="452" width="930" height="82" fill="#990024" />
  <text x="500" y="487" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">
    DUAL TRANSDUCTION CORE (SPCE / BME688)
  </text>
  <text x="125" y="519" fill="#ffffff" font-size="17" font-weight="bold">[Faradaic Redox Output]</text>
  <text x="875" y="519" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="end">[Matrix Noise Reference]</text>

  <!-- Left connection from Crimson Bar to Green Filter -->
  <line x1="215" y1="534" x2="215" y2="675" stroke="#000000" stroke-width="2" />
  <line x1="215" y1="675" x2="620" y2="675" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="228" y="605" fill="#000000" font-size="16">
    <tspan x="228" dy="0">(Extracted Redox</tspan>
    <tspan x="228" dy="24">Faradaic Peak)</tspan>
  </text>

  <!-- Right connection from Crimson Bar to Green Filter -->
  <line x1="830" y1="534" x2="830" y2="635" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="835" y="575" fill="#000000" font-size="15">
    <tspan x="835" dy="0">(Internal matrix</tspan>
    <tspan x="835" dy="22">reference)</tspan>
  </text>

  <!-- 5. OLIVE GREEN BOX: Always-on NLMS Filter equivalent (#559900 / #4d9900) -->
  <rect x="620" y="638" width="345" height="72" fill="#4da600" />
  <text x="792" y="682" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">
    ALWAYS-ON 3-TIER ML ENGINE
  </text>

  <!-- Route from Olive Green Filter down to Purple Final Box -->
  <line x1="792" y1="710" x2="792" y2="815" stroke="#000000" stroke-width="2" />
  <line x1="792" y1="815" x2="570" y2="815" stroke="#000000" stroke-width="2" />
  <line x1="570" y1="815" x2="570" y2="885" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 6. PURPLE FINAL BOX: Final Audio Output equivalent (#cc66ff / #b84dff) -->
  <rect x="370" y="887" width="400" height="72" fill="#cc66ff" stroke="#000000" stroke-width="2" />
  <text x="570" y="931" fill="#000000" font-size="22" font-weight="bold" text-anchor="middle">
    FINAL SCREENING OUTPUT
  </text>

</svg>
