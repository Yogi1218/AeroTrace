<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <!-- Sharp Arrow Marker matching reference style -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- 1. TOP BAR: Single Breath Input (Sky Blue) -->
  <rect x="50" y="40" width="700" height="52" fill="#0099e6" />
  <text x="400" y="72" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
    Single Exhaled Breath Input
  </text>

  <!-- Line dropping from top bar to split -->
  <line x1="400" y1="92" x2="400" y2="150" stroke="#000000" stroke-width="1.8" />
  <!-- Horizontal splitter line -->
  <line x1="130" y1="150" x2="670" y2="150" stroke="#000000" stroke-width="1.8" />
  
  <!-- Drop to Left Box -->
  <line x1="130" y1="150" x2="130" y2="215" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- Drop to Right Box -->
  <line x1="670" y1="150" x2="670" y2="215" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 2. LEFT BOX: 50ms Circular Buffer equivalent (Solid Royal Blue) -->
  <rect x="15" y="218" width="230" height="55" fill="#0055ff" />
  <text x="130" y="239" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">
    AEROSOL COLLECTION TRAP
  </text>
  <text x="130" y="259" fill="#ffffff" font-size="11" text-anchor="middle">
    (Concentrates liquid microdroplets)
  </text>

  <!-- 3. RIGHT BOX: Speech-Only VAD Trigger equivalent (Solid Dark Green) -->
  <rect x="555" y="218" width="230" height="55" fill="#008800" />
  <text x="670" y="239" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">
    BREATH-ONLY FLOW TRIGGER
  </text>
  <text x="670" y="259" fill="#ffffff" font-size="11" text-anchor="middle">
    (Low-power pressure wakeup)
  </text>

  <!-- Arrows dropping to Crimson Bar -->
  <line x1="130" y1="273" x2="130" y2="350" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="135" y="300" fill="#000000" font-size="11.5">
    <tspan x="135" dy="0">(Impaction onto</tspan>
    <tspan x="135" dy="16">SPCE strip)</tspan>
  </text>

  <line x1="670" y1="273" x2="670" y2="350" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="675" y="300" fill="#000000" font-size="11.5">
    <tspan x="675" dy="0">(Wakes up on valid</tspan>
    <tspan x="675" dy="16">alveolar breath)</tspan>
  </text>

  <!-- 4. WIDE CRIMSON BANNER: Dual Output DCCRN equivalent (Deep Maroon/Crimson) -->
  <rect x="15" y="354" width="770" height="60" fill="#990024" />
  <text x="400" y="378" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
    DUAL TRANSDUCTION CORE (SPCE + BME688)
  </text>

  <!-- Sub-labels on Crimson Bar matching [Speech Mask Output] / [Noise Mask Output] -->
  <text x="95" y="402" fill="#ffffff" font-size="13" font-weight="bold">[Faradaic Redox Output]</text>
  <text x="695" y="402" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="end">[Matrix Noise Reference]</text>

  <!-- Left drop from Crimson Bar -->
  <line x1="165" y1="414" x2="165" y2="520" stroke="#000000" stroke-width="1.8" />
  <!-- Horizontal connection to Olive Filter -->
  <line x1="165" y1="520" x2="495" y2="520" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="175" y="460" fill="#000000" font-size="12">
    <tspan x="175" dy="0">(Extracted Faradaic</tspan>
    <tspan x="175" dy="18">Redox Peaks)</tspan>
  </text>

  <!-- Right drop from Crimson Bar to Olive Filter -->
  <line x1="670" y1="414" x2="670" y2="480" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="675" y="445" fill="#000000" font-size="12">
    <tspan x="675" dy="0">(Ambient / VOC</tspan>
    <tspan x="675" dy="18">Reference)</tspan>
  </text>

  <!-- 5. OLIVE GREEN BOX: Always-on NLMS Filter equivalent -->
  <rect x="495" y="484" width="285" height="55" fill="#449e1e" />
  <text x="637" y="516" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">
    ALWAYS-ON 3-TIER ML ENGINE
  </text>

  <!-- Drop from Olive Filter to Final Output -->
  <line x1="637" y1="539" x2="637" y2="615" stroke="#000000" stroke-width="1.8" />
  <line x1="637" y1="615" x2="455" y2="615" stroke="#000000" stroke-width="1.8" />
  <line x1="455" y1="615" x2="455" y2="670" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 6. FINAL WHITE BOX: Final Audio Output equivalent -->
  <rect x="300" y="675" width="310" height="54" fill="#ffffff" stroke="#111111" stroke-width="1.8" />
  <text x="455" y="707" fill="#000000" font-size="17" font-weight="bold" text-anchor="middle">
    FINAL SCREENING OUTPUT
  </text>
  <text x="455" y="724" fill="#555555" font-size="10.5" font-weight="bold" text-anchor="middle">
    POSITIVE  |  NEGATIVE  |  INCONCLUSIVE
  </text>

</svg>
